<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 196" width="820" height="196" font-family="'SF Mono','Cascadia Code','JetBrains Mono',Menlo,Consolas,monospace" text-rendering="geometricPrecision">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#9d0006" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- terminal window on the gruvbox-light background -->
  <rect x="8" y="8" width="804" height="180" rx="11" fill="#fbf1c7" stroke="#e8dca0" stroke-width="1" filter="url(#shadow)"/>

  <!-- window controls, in gruvbox tones -->
  <circle cx="34" cy="31" r="6" fill="#cc241d"/>
  <circle cx="56" cy="31" r="6" fill="#b57614"/>
  <circle cx="78" cy="31" r="6" fill="#98971a"/>
  <text x="410" y="35" text-anchor="middle" font-size="12.5" fill="#9d0006" fill-opacity="0.45">ghostty · tmux · claude code</text>
  <line x1="8" y1="50" x2="812" y2="50" stroke="#e8dca0" stroke-width="1"/>

  <!-- status line, 14px mono; heat colours: maroon #9d0006 calm, amber #b57614, red #cc241d, empty-bar tint #e2a9ad -->
  <g font-size="14" font-weight="bold">
    <!-- line 1: working directory -->
    <text x="28" y="82" xml:space="preserve" fill="#9d0006"> ~/Projects/slrepo/src</text>

    <!-- line 2: owner / repo / branch / PR -->
    <text x="28" y="108" xml:space="preserve" fill="#9d0006"> apurwa › ai-job-search › feature/auth* ↑2 Δ4 › PR #128 changes_requested</text>

    <!-- line 3: usage — 5h (amber, warn) / 7d (red, alarm) / ctx (calm) -->
    <text x="28" y="134" xml:space="preserve"><tspan fill="#9d0006"> 5h </tspan><tspan fill="#b57614">██████</tspan><tspan fill="#e2a9ad">░░</tspan><tspan fill="#b57614"> 72%</tspan><tspan fill="#9d0006"> (1h49m) → › 7d </tspan><tspan fill="#cc241d">███████</tspan><tspan fill="#e2a9ad">░</tspan><tspan fill="#cc241d"> 86%</tspan><tspan fill="#9d0006"> (3d5h) </tspan><tspan fill="#cc241d">↑ cap ~9h</tspan><tspan fill="#9d0006"> › ctx </tspan><tspan fill="#9d0006">██</tspan><tspan fill="#e2a9ad">░░░░░░</tspan><tspan fill="#9d0006"> 31%</tspan></text>

    <!-- line 4: model / effort / thinking / cost -->
    <text x="28" y="160" xml:space="preserve" fill="#9d0006"> Opus 5 › high › thinking › ~$35.11</text>
  </g>
</svg>
