<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 932 316" width="932" height="316" font-family="'SF Mono','Cascadia Code','JetBrains Mono',Menlo,Consolas,monospace" text-rendering="geometricPrecision">
  <!-- Each row is the usage line (line 3) on that theme's real background, so the
       calm colour and the amber/red heat are shown exactly as they render. -->

