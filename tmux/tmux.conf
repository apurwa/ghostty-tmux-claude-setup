# Pass modified keys (Shift+Enter, Ctrl+Enter, etc.) through to applications
# using the CSI u / extended-keys protocol. Ghostty sets TERM=xterm-ghostty,
# so the xterm* pattern matches it.
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Mouse: click to focus a pane, drag borders to resize, wheel to scroll,
# and right-click for tmux's context menus (pane, window, and status bar).
set -g mouse on

# Splits that read like what they do, opening in the current directory.
# The stock C-b % and C-b " still work.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Move between panes without the prefix.
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Right-click a pane -> split / new-window / kill menu, ALWAYS.
#
# tmux's default MouseDown3Pane only shows this menu when no foreground app has
# mouse capture on; inside a mouse-capturing TUI (Claude Code, vim, less) it
# forwards the click to the app instead, so nothing appears. This unconditional
# binding overrides that so the menu opens over any pane. The trade-off: apps
# no longer receive a right-click — fine here, since terminal TUIs rarely use
# one. (Left-drag selection and the wheel are untouched; only button 3 changes.)
unbind -n MouseDown3Pane
bind -n MouseDown3Pane select-pane -t = \; display-menu -T "#[align=centre] pane #{pane_index} " -x M -y M \
  "Split Right"   \| { split-window -h -c "#{pane_current_path}" } \
  "Split Down"    -  { split-window -v -c "#{pane_current_path}" } \
  "New Window"    n  { new-window   -c "#{pane_current_path}" } \
  "" \
  "#{?window_zoomed_flag,Unzoom,Zoom}" z { resize-pane -Z } \
  "Swap Left"     h  { swap-pane -U } \
  "Swap Right"    l  { swap-pane -D } \
  "" \
  "Kill Pane"     X  { kill-pane }

# Start numbering at 1 and renumber on close, so window numbers stay contiguous.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Reload this file with C-b r.
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Status bar: tan background, deep red text, window list centred rather than
# hugging the left edge. status-left ([session]) and status-right stay pinned
# to the edges and inherit these colours; the active window is bolded so it
# stays distinguishable now that everything shares one colour pair.
set -g status-style "bg=#d5c4a1,fg=#9d0006"
set -g status-justify centre
set -g window-status-current-style "bold"

# Window tabs show just the name: no "#I:" index prefix and no "#F" flags
# (* current, - last, Z zoomed, ! bell). The bold above is now the only
# marker for the active window.
set -g window-status-format "#W"
set -g window-status-current-format "#W"

# Separate window tabs with a pipe instead of a bare space.
set -g window-status-separator " | "

# Drop the quoted pane title from the right side; keep the clock and the
# window_bigger scroll-offset indicator.
set -g status-right '#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}%H:%M %d-%b-%y'

# Bold the session name on the left and the clock on the right.
set -g status-left-style bold
set -g status-right-style bold
